[package]
name = "nanovm-js"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
boa_engine = { version = "0.22.0", default-features = false }
boa_runtime = { version = "0.22.0", default-features = false, features = ["url"] }
wasip3 = { version = "0.9.0", features = ["async-spawn"] }
wit-bindgen = "0.62"
