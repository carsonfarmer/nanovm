# Synthetic traces only; pinned otelcol-contrib 0.164.0. Not production policy.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:NICE_OTLP_PORT}
processors:
  attributes/redact:
    actions:
      - key: demo.secret
        action: delete
  resource/fixture:
    attributes:
      - key: demo.secret
        action: delete
      - key: deployment.environment.name
        value: nice-to-haves-fixture
        action: upsert
exporters:
  file:
    path: ${env:NICE_EXPORT_FILE}
service:
  telemetry:
    logs:
      level: error
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, resource/fixture]
      exporters: [file]
