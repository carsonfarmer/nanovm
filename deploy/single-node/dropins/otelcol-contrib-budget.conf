# /etc/systemd/system/otelcol-contrib.service.d/budget.conf: a separately
# budgeted Collector (README, "Collector and operator checks"), on the core
# nanovm doesn't use, with its own memory ceiling. Size both for your
# processors and backend; the reference config's memory_limiter should stay
# below MemoryMax.
[Service]
AllowedCPUs=3
MemoryMax=1G
