# A minimal Prometheus for the single-node reference: the Collector's derived
# span metrics (8889) and its own metrics (8888), node_exporter (9100) for
# disk, and the rules. Keep these ports on loopback.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - nanovm-rules.yaml
scrape_configs:
  - job_name: nanovm-spans
    static_configs:
      - targets: ['127.0.0.1:8889']
  - job_name: otelcol
    static_configs:
      - targets: ['127.0.0.1:8888']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
