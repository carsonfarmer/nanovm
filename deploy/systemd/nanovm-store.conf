# /etc/systemd/system/nanovm.service.d/store.conf: needed for capture with a
# `store`, of either kind. In nanovm.toml:
#   [capture]
#   store = "/srv/nanovm-store"        # a disk of its own, mounted there
#   store = "s3://bucket/prefix"       # or an object store
[Service]
# The supervisor ships each object's committed versions, records what it
# shipped in the object's directory (objects/<app>/<shard>/<object>/shipped)
# and removes shipped versions from its committed/: directories the app's uid
# owns. Without this it ships an object's first version only, and then
# nothing (B-604).
CapabilityBoundingSet=CAP_DAC_OVERRIDE
# A directory store: ProtectSystem=strict leaves only StateDirectory=
# writable. ("-": ignored when the path doesn't exist, as with an S3 store.)
ReadWritePaths=-/srv/nanovm-store
# An object store's credentials: AWS_* in this file (mode 0600). Workers never
# see them: the supervisor starts each with an empty environment.
EnvironmentFile=-/etc/nanovm/store.env
