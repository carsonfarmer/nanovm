# /etc/sysctl.d/90-nanovm.conf. Each nanovm worker needs about
# 24 x (max_live_objects + 32) + 4096 memory mappings (crates/nanovm/src/
# engine.rs, MAPS_PER_OBJECT) and refuses to start below it. The default
# 65530 fits about 2,500 live objects per app; this fits about 43,500.
# Apply now with: sysctl --system
vm.max_map_count = 1048576
