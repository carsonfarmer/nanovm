# /etc/nanovm/nanovm.toml for nanovm.service. Every key and its default is in
# crates/nanovm/src/config.rs; unknown keys are refused.

# Only the proxy may reach the node: it trusts the nanovm-app/-trust headers.
listen = "127.0.0.1:8080"
# StateDirectory=nanovm. Keep it absolute (a relative one is relative to
# this file).
data_dir = "/var/lib/nanovm"
# Per app worker. Sizes the pooling allocator and the fd/mapping preflight:
# about 2 x (max_live_objects + 32) + 1024 fds and 24 x (max_live_objects + 32)
# + 4096 mappings per worker.
max_live_objects = 1000
max_apps = 100
# The proxy's private endpoint (committed WebSocket publishes go to its
# /publish) and the Collector's OTLP/HTTP base URL.
proxy = "http://127.0.0.1:8444"
telemetry_endpoint = "http://127.0.0.1:4318"
# App i runs as uid/gid jail_uid_base + i. Never change it on a node with
# data: an app's uid is the owner of its objects directory.
jail_uid_base = 200000
# With nanovm-cgroup.conf installed, each worker goes in <cgroup>/worker-<n>:
# cgroup = "/sys/fs/cgroup/system.slice/nanovm.service/apps"

# Operator ceilings: each app's own limits are clamped to these.
[limits]
memory_mb = 64
cpu_ms = 200
request_timeout_ms = 5000
disk_mb = 64
max_files = 1000

# Whole-worker limits, applied only through `cgroup`. 0 leaves one unset.
[worker]
memory_mb = 0
cpus = 0.0
pids = 0
