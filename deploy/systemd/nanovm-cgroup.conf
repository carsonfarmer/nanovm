# /etc/systemd/system/nanovm.service.d/cgroup.conf: cgroup v2 limits per app
# worker ([worker] memory_mb, cpus, pids in nanovm.toml). Also set, in
# nanovm.toml:
#   cgroup = "/sys/fs/cgroup/system.slice/nanovm.service/apps"
#
# Layout (cgroup v2 forbids processes in a group that delegates controllers):
#   nanovm.service/             controllers enabled for its children
#   nanovm.service/supervisor   nanovm serve (DelegateSubgroup)
#   nanovm.service/.control     ExecStartPre (systemd puts it there)
#   nanovm.service/apps/worker-<n>  one jailed worker each, with its app's limits
[Service]
Delegate=cpu memory pids
DelegateSubgroup=supervisor
# The supervisor writes worker-<n>/memory.max, cpu.max, pids.max, cgroup.procs:
# with ProtectControlGroups=yes creating apps/worker-<n> fails read-only (EROFS).
ProtectControlGroups=no
# Full privileges ('+'), before the supervisor starts: hand the controllers
# down to apps/. A missing controller stays off, and nanovm then refuses to
# start a worker whose [worker] limit needs it, naming the file.
ExecStartPre=+/bin/sh -ec '\
  g=/sys/fs/cgroup$(dirname "$(sed -n "s/^0:://p" /proc/self/cgroup)"); \
  mkdir -p "$g/apps"; \
  for c in cpu memory pids; do \
    if grep -qw "$c" "$g/cgroup.controllers"; then \
      echo "+$c" > "$g/cgroup.subtree_control"; \
      echo "+$c" > "$g/apps/cgroup.subtree_control"; \
    fi; \
  done; \
  echo "nanovm: controllers for apps: $(cat "$g/apps/cgroup.subtree_control")"'
