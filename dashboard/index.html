<!doctype html>
<meta charset="utf-8">
<title>nanovm</title>
<h1>nanovm</h1>
<h2>Stats</h2>
<pre id="stats"></pre>
<h2>Events</h2>
<pre id="events"></pre>
<script>
const api = (path) => fetch("/_nanovm" + path, { cache: "no-store" }).then((r) => r.json());
let seq = 0;
const log = [];

async function tick() {
  const s = await api("/stats").catch(() => null);
  if (s) document.getElementById("stats").textContent = JSON.stringify(s, null, 2);
  for (const e of await api("/events?since=" + seq).catch(() => [])) {
    seq = e.seq;
    log.unshift(`${(e.t_ms / 1000).toFixed(1)}s ${e.kind} ${e.app}/${e.object}: ${e.detail.split("\n")[0]}`);
  }
  log.length = Math.min(log.length, 100);
  document.getElementById("events").textContent = log.join("\n");
}
tick();
setInterval(tick, 1000);
</script>
