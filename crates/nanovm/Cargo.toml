[package]
name = "nanovm"
version = "0.1.0"
edition.workspace = true

[dependencies]
# wasmtime's defaults less what the node never uses: its own compile cache
# (`engine::load_component` keeps one), profilers, core dumps, the text
# format, guest debugging, compile-time builtins and runtime WIT parsing.
# The wasm proposals a guest may use are unchanged.
wasmtime = { version = "50.0.0", default-features = false, features = [
    "anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "parallel-compilation", "cranelift",
    "pooling-allocator", "demangle", "addr2line", "runtime", "component-model", "component-model-async", "threads",
    "stack-switching", "std",
] }
# Only WASIp2 and p3 for components; no WASIp1 (core modules).
wasmtime-wasi = { version = "50.0.0", default-features = false, features = ["p2", "p3"] }
# Only wasi:http@0.3. `egress` sends requests itself, but maps a bad TLS
# name through `default-send-request`'s error.
wasmtime-wasi-http = { version = "50.0.0", default-features = false, features = ["default-send-request", "p3"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
bytes = "1.11"
futures = "0.3.31"
http = "1.5"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.9", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
sha2 = "0.10"
serde_json = "1"
libc = "0.2"
parking_lot = "0.12"
scopeguard = "1.2"
rustix = { version = "1.1", features = ["net"] }
oci-spec = { version = "0.10", default-features = false, features = ["distribution"] }
sigstore-verify = "0.15.1"
# Only the embedded trusted root, not its TUF client.
sigstore-trust-root = { version = "0.15.1", default-features = false }
semver = "1"
sigstore-types = "0.15.1"
wasmtime-wasi-config = "50.0.0"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "logs", "internal-logs"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
prost = "0.14"
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
tikv-jemallocator = { version = "0.7", default-features = false }

[features]
# Allows `dev = true` (no signature checks, private registries and egress).
# Off by default, so a release build can't be configured into dev mode.
dev = []

[dev-dependencies]
# The tests run nodes in dev mode against a loopback registry.
nanovm = { path = ".", default-features = false, features = ["dev"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = "0.30"
tokio = { version = "1", features = ["test-util"] }
container-registry = { version = "0.3.1", features = ["test-support"] }
