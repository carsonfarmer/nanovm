[package]
name = "nanovm"
version = "0.1.0"
edition.workspace = true

[dependencies]
wasmtime = { version = "50.0.0", features = ["component-model-async", "pooling-allocator"] }
wasmtime-wasi = { version = "50.0.0", features = ["p3"] }
wasmtime-wasi-http = { version = "50.0.0", features = ["p3"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
bytes = "1.11"
futures = "0.3.31"
http = "1.5"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.9", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.7"
serde = { version = "1", features = ["derive", "rc"] }
toml = "0.9"
sha2 = "0.10"
serde_json = "1"
libc = "0.2"
parking_lot = "0.12"
rustix = { version = "1.1", features = ["net"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
sigstore-verify = "0.15.1"
sigstore-trust-root = "0.15.1"
semver = "1"
sigstore-types = "0.15.1"
wasmtime-wasi-config = "50.0.0"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
