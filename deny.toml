# cargo-deny (https://embarkstudios.github.io/cargo-deny/): advisories,
# licenses, banned or duplicated crates and crate sources for the node.
# `cargo deny check`; CI runs it in .github/workflows/supply-chain.yml.

[graph]
# nanovm runs on Linux only (Landlock, seccomp, cgroups).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# Both come from `tempdir`, which the dev-dependency `container-registry`
# (0.3.1, the latest) needs for its `test-support` loopback registry. Neither
# is in the node binary; the tests delete only their own temporary storage.
# Review when container-registry drops tempdir.
ignore = [
    { id = "RUSTSEC-2023-0018", reason = "remove_dir_all 0.5 TOCTOU: dev-only, via tempdir in container-registry's test registry" },
    { id = "RUSTSEC-2018-0017", reason = "tempdir unmaintained: dev-only, via container-registry's test-support feature" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The guest and component workspaces use fewer licenses than the node.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# nanovm and the test guests are not published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
