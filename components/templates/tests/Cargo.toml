[package]
name = "templates-tests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
util = { path = "../../../guests/util" }
wit-bindgen = "0.62"
serde_json = "1"
# Linked directly too, to compare the component with the library in one app.
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "macros", "multi_template", "loader", "json", "std_collections"] }
