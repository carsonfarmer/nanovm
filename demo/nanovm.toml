# nanovm demo node. Apps come from the loopback registry `cargo run --example
# dev-registry` serves; dev mode runs them unsigned. Each app runs in its own
# jailed worker process.
listen = "127.0.0.1:8080"
data_dir = "../nanovm-data"
max_live_objects = 8000
memory_reservation_mb = 64
epoch_tick_ms = 5
dev = true
