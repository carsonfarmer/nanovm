name: Fuzz

# The cargo-fuzz targets in fuzz/ (D-45), a few minutes each. Nightly and on
# demand only. A crash fails the job and uploads its input.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [ws_events, grip_publish, txt_record, app_ref, journal_log, telemetry_stamp]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Fuzz
        run: |
          python3 fuzz/seeds.py
          dict=""
          if [ -f "fuzz/dicts/${{ matrix.target }}.dict" ]; then dict="-dict=fuzz/dicts/${{ matrix.target }}.dict"; fi
          cargo fuzz run --fuzz-dir fuzz ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- \
            -max_total_time=${{ inputs.seconds || 300 }} -timeout=10 -rss_limit_mb=2048 $dict
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
