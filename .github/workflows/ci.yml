name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      # CPU budgets count wall time inside guest polls. Avoid unrelated tests
      # competing for the runner's cores; concurrency tests still run their load.
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            guests -> target
      - name: Prepare host limits
        run: sudo sysctl -w vm.max_map_count=1048576
      - name: Enforce runtime line budget
        run: |
          python3 - <<'PY'
          import pathlib, re
          total = 0
          for path in pathlib.Path('crates/nanovm/src').glob('*.rs'):
              runtime = re.split(r'#\[cfg\(test\)\]\s*mod\s', path.read_text(), maxsplit=1)[0]
              total += sum(bool(line.strip()) and not line.strip().startswith('//') for line in runtime.splitlines())
          print(f'Runtime: {total} lines (must be below 5000)')
          assert total < 5000, 'Runtime line budget exceeded'
          PY
      - name: Build guests locally (no publishing)
        run: cargo build --locked --release --target wasm32-wasip2 --manifest-path guests/Cargo.toml
      - name: Check production build without dev features
        run: cargo check --locked -p nanovm --bin nanovm
      - name: Run unit and integration tests
        run: |
          ulimit -n "$(ulimit -Hn)"
          env -u RUST_BACKTRACE cargo test --locked -p nanovm
